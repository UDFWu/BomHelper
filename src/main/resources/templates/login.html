<!DOCTYPE html>
<html lang="zh-TW" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="context-path" th:content="@{/}">
    <title>登入 - SBOM 管理系統</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/css/base.css}">
    <link rel="stylesheet" th:href="@{/css/login.css}">
</head>
<body>
<div class="login-card">
    <div class="brand">
        <h1>🛡️ BOM Helper</h1>
        <p>請選擇 GitLab 或本系統帳號登入</p>
    </div>

    <div th:if="${errorMessage}" class="alert alert-error" th:text="${errorMessage}"></div>
    <div th:if="${logoutMessage}" class="alert alert-info" th:text="${logoutMessage}"></div>

    <form th:action="@{/login}" method="post" autocomplete="off">
        <div class="form-group">
            <label for="loginSource">登入方式</label>
            <select id="loginSource" name="loginSource">
                <option value="gitlab">GitLab 帳號</option>
                <option value="local">本系統帳號</option>
            </select>
        </div>
        <div class="form-group">
            <label for="username">帳號</label>
            <input type="text" id="username" name="username" required autofocus>
        </div>
        <div class="form-group">
            <label for="password">密碼</label>
            <input type="password" id="password" name="password" required>
        </div>
        <button type="submit" class="btn-login">登入</button>
    </form>

    <div class="hint">
        GitLab 帳號依 Group / Project 權限存取報告。<br>
        資訊安全處（0170）與管理員（9999）使用本機帳號。<br>
        資訊研發處（0113）請使用 GitLab 登入。
    </div>
</div>
</body>
</html>
