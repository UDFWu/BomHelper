<!DOCTYPE html>
<html lang="zh-TW" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="context-path" th:content="@{/}">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>影響範圍與組成查詢 - sbomHelper</title>
    <link rel="stylesheet" th:href="@{/css/base.css}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<div class="page-wrapper">

    <div class="search-container">
        <h2>🔍 SBOM 雙向查詢系統</h2>

        <div class="search-box">
            <select id="searchType" class="search-type-select">
                <option value="component">按套件名稱查詢</option>
                <option value="application">按專案名稱查詢</option>
            </select>

            <input type="text" id="searchInput" class="search-input" placeholder="請輸入關鍵字..." onkeypress="handleKeyPress(event)">
            <select id="versionOperator" class="search-type-select version-operator" aria-label="版本比較條件">
                <option value="=">版本等於</option>
                <option value=">">版本大於</option>
                <option value=">=">版本大於等於</option>
                <option value="<">版本小於</option>
                <option value="<=">版本小於等於</option>
            </select>
            <input type="text" id="versionInput" class="search-input version-input" placeholder="套件版本（選填，如 2.1.0）" onkeypress="handleKeyPress(event)">
            <button onclick="performSearch()" class="search-btn">查詢</button>
        </div>
    </div>

    <div class="result-container">
        <div id="resultArea">
            <div class="no-result">請選擇查詢模式並輸入關鍵字進行搜尋。</div>
        </div>
    </div>

</div>

<script>
    const CONTEXT_PATH_RAW = document
        .querySelector('meta[name="context-path"]')
        ?.getAttribute("content") || "";

    const API_BASE = CONTEXT_PATH_RAW.endsWith("/")
        ? CONTEXT_PATH_RAW.slice(0, -1)
        : CONTEXT_PATH_RAW;

    // 資安防護：跳脫 HTML 特殊字元
    function escapeHTML(str) {
        if (!str) return '';
        return String(str).replace(/[&<>'"]/g, function(tag) {
            const charsToReplace = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                "'": '&#39;',
                '"': '&quot;'
            };
            return charsToReplace[tag] || tag;
        });
    }

    // 監聽 Enter 鍵
    function handleKeyPress(event) {
        if (event.key === 'Enter') performSearch();
    }

    // 專案名稱查詢不需要版本條件，避免造成使用者誤解
    function updateVersionFilterVisibility() {
        const isComponentSearch = document.getElementById('searchType').value === 'component';
        const versionInput = document.getElementById('versionInput');
        const versionOperator = document.getElementById('versionOperator');
        versionInput.hidden = !isComponentSearch;
        versionInput.disabled = !isComponentSearch;
        versionOperator.hidden = !isComponentSearch;
        versionOperator.disabled = !isComponentSearch;
        if (!isComponentSearch) versionInput.value = '';
    }

    document.getElementById('searchType').addEventListener('change', updateVersionFilterVisibility);

    // 執行搜尋
    function downloadLink(reportId) {
        if (!Number.isInteger(reportId) || reportId <= 0) return '-';
        return `<a href="${escapeHTML(API_BASE)}/api/v1/bom/reports/${reportId}/download" onclick="event.stopPropagation()">下載報告</a>`;
    }

    function performSearch() {
        const type = document.getElementById('searchType').value;
        const keyword = document.getElementById('searchInput').value.trim();
        const version = document.getElementById('versionInput').value.trim();
        const versionOperator = document.getElementById('versionOperator').value;
        const resultArea = document.getElementById('resultArea');

        if (!keyword) {
            alert('請輸入關鍵字！');
            return;
        }

        resultArea.innerHTML = '<div class="loading">正在為您檢索資料，請稍候...</div>';

        const searchParams = new URLSearchParams({ type, keyword });
        if (type === 'component' && version) {
            searchParams.set('version', version);
            searchParams.set('versionOperator', versionOperator);
        }

        fetch(`${API_BASE}/api/v1/bom/search?${searchParams.toString()}`)
            .then(response => {
                if (!response.ok) throw new Error('伺服器回應錯誤');
                return response.json();
            })
            .then(data => {
                if (data.length === 0) {
                    const noResultMessage = type === 'component' && version
                        ? `找不到套件名稱「${escapeHTML(keyword)}」且版本${escapeHTML(versionOperator)}「${escapeHTML(version)}」的結果。`
                        : `找不到與「${escapeHTML(keyword)}」相符的結果。`;
                    resultArea.innerHTML = `<div class="no-result">${noResultMessage}</div>`;
                    return;
                }

                if (type === 'application') {
                    renderApplicationView(data, resultArea);
                } else {
                    renderComponentView(data, resultArea);
                }
            })
            .catch(err => {
                console.error(err);
                resultArea.innerHTML = '<div class="no-result text-error">❌ 查詢失敗，請檢查網路狀態或聯絡管理員。</div>';
            });
    }

    // 處理手動折疊的控制函數 (用於 Component 模式的 Table 行折疊)
    function toggleRow(rowId, iconId) {
        const detailRow = document.getElementById(rowId);
        const icon = document.getElementById(iconId);

        if (detailRow.hidden) {
            detailRow.hidden = false;
            icon.classList.add('open');
        } else {
            detailRow.hidden = true;
            icon.classList.remove('open');
        }
    }

    // 依 CVSS 分數回傳符合風險等級的文字樣式；每個元件顯示其最高弱點分數。
    function formatVulnerabilityScore(score) {
        const value = Number(score);
        const safeScore = Number.isFinite(value) ? Math.min(10, Math.max(0, value)) : 0;
        let level = 'None';
        let cssClass = 'score-none';
        if (safeScore >= 9) {
            level = 'Critical';
            cssClass = 'score-critical';
        } else if (safeScore >= 7) {
            level = 'High';
            cssClass = 'score-high';
        } else if (safeScore >= 4) {
            level = 'Medium';
            cssClass = 'score-medium';
        } else if (safeScore > 0) {
            level = 'Low';
            cssClass = 'score-low';
        }
        return `<span class="vulnerability-score ${cssClass}" title="${level}">${safeScore.toFixed(1)}</span>`;
    }

    function getVulnerabilityScore(score) {
        const value = Number(score);
        return Number.isFinite(value) ? Math.min(10, Math.max(0, value)) : 0;
    }

    // 僅顯示 Project 的 Owner、Maintainer（包含繼承成員）。
    function renderSupervisorSelect(supervisors) {
        if (!Array.isArray(supervisors) || supervisors.length === 0) return '-';
        const options = supervisors.map((supervisor, index) =>
            `<option value="${escapeHTML(supervisor)}"${index === 0 ? ' selected' : ''}>${escapeHTML(supervisor)}</option>`
        ).join('');
        return `<select class="supervisor-select" aria-label="GitLab Project 負責人" onclick="event.stopPropagation()" onkeydown="event.stopPropagation()">${options}</select>`;
    }

    // 💡 模式 1 (已更新)：依專案名稱查詢，加入掃描時間顯示
    function renderApplicationView(data, container) {

        // 1. 先將平面資料依據 Gitlab Project ID 分組
        const projects = Object.create(null);
        data.forEach(item => {
            const pid = String(item.reportId);
            if (!projects[pid]) {
                // 💡 在初始化專案物件時，順便存下時間 (timestamp) 與 上傳者 (importedBy)
                projects[pid] = {
                    direct: [],
                    transitive: [],
                    timestamp: item.timestamp,
                    reportId: item.reportId,
                    projectName: item.gitlabProjectId,
                    importedBy: item.importedBy,
                    supervisors: item.supervisors,
                    maxVulnerabilityScore: 0
                };
            }
            projects[pid].maxVulnerabilityScore = Math.max(
                projects[pid].maxVulnerabilityScore,
                getVulnerabilityScore(item.vulnerabilityScore)
            );
            if (item.isTransitive) {
                projects[pid].transitive.push(item);
            } else {
                projects[pid].direct.push(item);
            }
        });

        let html = `
            <h3 class="section-title">專案套件依賴關係</h3>
            <div class="tree-container">
        `;

        // 2. 建立樹狀結構
        const sortedProjects = Object.entries(projects)
            .sort(([, left], [, right]) => right.maxVulnerabilityScore - left.maxVulnerabilityScore);
        for (const [pid, groups] of sortedProjects) {
            const totalCount = groups.direct.length + groups.transitive.length;

            // 💡 處理時間格式化 (與模式 2 保持一致)
            let dateStr = '-';
            if (groups.timestamp) {
                dateStr = new Date(groups.timestamp).toLocaleString('zh-TW', {
                    year: 'numeric', month: '2-digit', day: '2-digit',
                    hour: '2-digit', minute: '2-digit'
                });
            }

            // 上傳者
            const importedByStr = groups.importedBy ? escapeHTML(groups.importedBy) : '-';

            // 專案根節點 (將時間 / 上傳者加入到 badge 內或後方)
            html += `
                <details class="tree-node project-node" open>
                    <summary class="tree-summary project-summary project-columns">
                        <span class="project-column"><span class="column-label">GitLab Project 名稱</span><strong class="project-name">📁 ${escapeHTML(groups.projectName)}</strong></span>
                        <span class="project-column"><span class="column-label">掃描時間</span><span>${dateStr}</span></span>
                        <span class="project-column"><span class="column-label">上傳者</span><span>${importedByStr}</span></span>
                        <span class="project-column"><span class="column-label">套件數量</span><span>${totalCount} 個套件</span></span>
                        <span class="project-column"><span class="column-label">負責人</span>${renderSupervisorSelect(groups.supervisors)}</span>
                        <span class="project-column"><span class="column-label">下載報告</span><span class="project-report-actions">${downloadLink(groups.reportId)}</span></span>
                    </summary>
                    <div class="tree-children">
            `;

            // 直接引入資料夾
            if (groups.direct.length > 0) {
                html += `
                    <details class="tree-node folder-node direct-folder" open>
                        <summary class="tree-summary folder-summary">
                            <span class="folder-icon">📂</span>
                            <strong>直接引入 (Direct Dependencies)</strong>
                            <span class="tree-badge badge-green">${groups.direct.length} 個</span>
                        </summary>
                        <div class="tree-children table-wrapper">
                            ${generateTreeTable(groups.direct)}
                        </div>
                    </details>
                `;
            }

            // 間接依賴資料夾
            if (groups.transitive.length > 0) {
                html += `
                    <details class="tree-node folder-node transitive-folder">
                        <summary class="tree-summary folder-summary">
                            <span class="folder-icon">📂</span>
                            <strong>間接依賴 (Transitive Dependencies)</strong>
                            <span class="tree-badge badge-yellow">${groups.transitive.length} 個</span>
                        </summary>
                        <div class="tree-children table-wrapper">
                            ${generateTreeTable(groups.transitive)}
                        </div>
                    </details>
                `;
            }

            html += `
                    </div>
                </details>
            `;
        }

        html += `</div>`;
        container.innerHTML = html;
    }

    // 輔助函數：用來產生樹狀結構底下的明細表格
    function generateTreeTable(components) {
        const sortedComponents = [...components]
            .sort((left, right) => getVulnerabilityScore(right.vulnerabilityScore) - getVulnerabilityScore(left.vulnerabilityScore));
        let tableHtml = `
            <table class="detail-table">
                <thead>
                    <tr>
                        <th>套件名稱 (Component)</th>
                        <th>版本</th>
                        <th>最高弱點分數</th>
                        <th>PURL (特徵)</th>
                    </tr>
                </thead>
                <tbody>
        `;
        sortedComponents.forEach(comp => {
            tableHtml += `
                <tr>
                    <td><strong>${escapeHTML(comp.componentName)}</strong></td>
                    <td>${escapeHTML(comp.componentVersion) || '-'}</td>
                    <td>${formatVulnerabilityScore(comp.vulnerabilityScore)}</td>
                    <td><div class="purl-text">${escapeHTML(comp.purl) || '-'}</div></td>
                </tr>
            `;
        });
        tableHtml += `</tbody></table>`;
        return tableHtml;
    }

    // 模式 2 (保持不變)：按套件名稱查詢，列出受影響專案
    function renderComponentView(data, container) {
        const groupedData = Object.create(null);
        data.forEach(item => {
            const pid = String(item.reportId);
            if (!groupedData[pid]) {
                groupedData[pid] = {
                    gitlabGroupId: item.gitlabGroupId,
                    timestamp: item.timestamp,
                    reportId: item.reportId,
                    projectName: item.gitlabProjectId,
                    importedBy: item.importedBy, // 💡 上傳者
                    supervisors: item.supervisors,
                    maxVulnerabilityScore: 0,
                    components: []
                };
            }
            groupedData[pid].maxVulnerabilityScore = Math.max(
                groupedData[pid].maxVulnerabilityScore,
                getVulnerabilityScore(item.vulnerabilityScore)
            );
            groupedData[pid].components.push({
                name: item.componentName,
                version: item.componentVersion,
                vulnerabilityScore: item.vulnerabilityScore
            });
        });

        let html = `
            <h3 class="section-title">受影響專案清單</h3>
            <table>
                <thead>
                    <tr>
                        <th class="expander-cell"></th>
                        <th>Gitlab Project</th>
                        <th>匹配套件數</th>
                        <th>Gitlab Group</th>
                        <th>最後掃描時間</th>
                        <th>上傳者</th>
                        <th>負責人</th>
                        <th>下載</th>
                    </tr>
                </thead>
                <tbody>
        `;

        let index = 0;
        const sortedProjects = Object.entries(groupedData)
            .sort(([, left], [, right]) => right.maxVulnerabilityScore - left.maxVulnerabilityScore);
        for (const [projectId, info] of sortedProjects) {
            const detailRowId = `detail-${index}`;
            const iconId = `icon-${index}`;

            let dateStr = '-';
            if (info.timestamp) {
                dateStr = new Date(info.timestamp).toLocaleString('zh-TW', {
                    year: 'numeric', month: '2-digit', day: '2-digit',
                    hour: '2-digit', minute: '2-digit'
                });
            }

            html += `
                <tr class="clickable-row" onclick="toggleRow('${detailRowId}', '${iconId}')">
                    <td class="text-center"><span id="${iconId}" class="toggle-icon">▶</span></td>
                    <td><strong class="text-primary">${escapeHTML(info.projectName)}</strong></td>
                    <td><span class="dependency-tag">${info.components.length} 個套件</span></td>
                    <td>${escapeHTML(info.gitlabGroupId)}</td>
                    <td class="metadata-cell">${dateStr}</td>
                    <td class="metadata-cell">${escapeHTML(info.importedBy) || '-'}</td>
                    <td>${renderSupervisorSelect(info.supervisors)}</td>
                    <td>${downloadLink(info.reportId)}</td>
                </tr>
            `;

            html += `
                <tr id="${detailRowId}" class="detail-row" hidden>
                    <td colspan="8">
                        <table class="detail-table">
                            <thead>
                                <tr>
                                    <th>命中套件名稱 (Component)</th>
                                    <th>使用版本</th>
                                    <th>最高弱點分數</th>
                                </tr>
                            </thead>
                            <tbody>
            `;

            [...info.components]
                .sort((left, right) => getVulnerabilityScore(right.vulnerabilityScore) - getVulnerabilityScore(left.vulnerabilityScore))
                .forEach(comp => {
                html += `
                                <tr>
                                    <td><strong>${escapeHTML(comp.name)}</strong></td>
                                    <td>${escapeHTML(comp.version) || '-'}</td>
                                    <td>${formatVulnerabilityScore(comp.vulnerabilityScore)}</td>
                                </tr>
                `;
                });

            html += `
                            </tbody>
                        </table>
                    </td>
                </tr>
            `;
            index++;
        }

        html += '</tbody></table>';
        container.innerHTML = html;
    }
</script>
</body>
</html>
