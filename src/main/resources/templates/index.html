<!DOCTYPE html>
<html lang="zh-TW" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="context-path" th:content="@{/}">
    <title>sbomHelper - 儀表板</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/css/base.css}">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
</head>
<body>

<div class="sidebar">
    <div class="sidebar-header">
        <h2>🛡️ sbomHelper</h2>
    </div>
    <ul class="nav-links">
        <li><a th:href="@{/search}" target="app-frame" class="active">🔍 SBOM 雙向查詢</a></li>
        <li><a th:href="@{/upload}" target="app-frame">📤 報告檔案上傳</a></li>
        <li th:if="${currentUser != null and currentUser.userAdmin}"><a th:href="@{/users}" target="app-frame">👤 使用者管理</a></li>
    </ul>
</div>

<div class="main-content">
    <div class="topbar">
        <div class="page-title">SBOM 影響範圍與組成查詢系統</div>
        <div class="user-actions">
            <span class="user-name"
                  th:text="${currentUser != null ? currentUser.displayName : '未登入'}">使用者</span>
            <span th:if="${currentUser != null and (currentUser.admin or currentUser.userAdmin)}"
                  class="admin-badge">Admin</span>
            <!-- 用一個 form 觸發 POST /logout (Spring Security 預設僅接受 POST) -->
            <form th:action="@{/logout}" method="post" target="_top" class="logout-form">
                <button type="submit" class="logout-btn">登出</button>
            </form>
        </div>
    </div>

    <div class="content-frame">
        <iframe id="app-frame" name="app-frame" th:src="@{/search}" title="功能內容"></iframe>
    </div>
</div>

<script>
    // 簡單的選單切換效果
    const links = document.querySelectorAll('.nav-links li a');
    links.forEach(link => {
        link.addEventListener('click', function() {
            links.forEach(l => l.classList.remove('active'));
            this.classList.add('active');
        });
    });
    const CONTEXT_PATH_RAW = document
        .querySelector('meta[name="context-path"]')
        ?.getAttribute("content") || "";

    const API_BASE = CONTEXT_PATH_RAW.endsWith("/")
        ? CONTEXT_PATH_RAW.slice(0, -1)
        : CONTEXT_PATH_RAW;
</script>
</body>
</html>
